defaults:
  image: nobreak-labs/ubuntu-24.04
  cpus: 2
  memory: 4096

vms:
  - name: docker
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.100/24
    provision:
      - name: change-apt-repo
        inline: |
          #!/bin/bash
          set -e

          ARCH=$(uname -m)
          RELEASE=$(lsb_release -cs)
          if [ "$RELEASE" = "jammy" ]; then
            # Ubuntu 22.04
            if [ "$ARCH" = "x86_64" ]; then
              sed -i 's/archive.ubuntu.com\|kr.archive.ubuntu.com\|security.ubuntu.com/ftp.kaist.ac.kr/g' /etc/apt/sources.list
            elif [ "$ARCH" = "aarch64" ]; then
              sed -i 's/ports.ubuntu.com/ftp.kaist.ac.kr/g' /etc/apt/sources.list
            fi
          elif [ "$RELEASE" = "noble" ] || [ "$RELEASE" = "resolute" ]; then
            # Ubuntu 24.04 / 26.04
            if [ "$ARCH" = "x86_64" ]; then
              sed -i 's|^URIs:.*|URIs: http://ftp.kaist.ac.kr/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
            elif [ "$ARCH" = "aarch64" ]; then
              sed -i 's|^URIs:.*|URIs: http://ftp.kaist.ac.kr/ubuntu-ports/|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
          fi
      - name: install-docker
        inline: |
          #!/bin/bash
          set -e

          # Add Docker's official GPG key:
          apt-get update
          apt-get -y install ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc

          # Add the repository to Apt sources:
          sudo tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF

          apt-get update
          apt-get -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          usermod -aG docker nobreak
