defaults:
  image: nobreak-labs/ubuntu-24.04
  cpus: 2
  memory: 2048

vms:
  - name: git-repo
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.100/24
    provision:
      - name: change-apt-repo
        path: scripts/ubuntu/change-apt-repo.sh

  - name: jenkins
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.101/24
    provision:
      - name: change-apt-repo
        path: scripts/ubuntu/change-apt-repo.sh

  - name: tomcat
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.102/24
    provision:
      - name: change-apt-repo
        path: scripts/ubuntu/change-apt-repo.sh

  - name: jenkins-node
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.103/24
    provision:
      - name: change-apt-repo
        path: scripts/ubuntu/change-apt-repo.sh

  - name: docker
    cpus: 4
    memory: 4096
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.104/24
    provision:
      - name: change-apt-repo
        path: scripts/ubuntu/change-apt-repo.sh
      - name: install-docker
        path: scripts/ubuntu/install-docker.sh

  - name: webserver
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.105/24
    provision:
      - name: change-apt-repo
        path: scripts/ubuntu/change-apt-repo.sh

  - name: kubernetes
    cpus: 4
    memory: 8192
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.106/24
    provision:
      - name: change-apt-repo
        path: scripts/ubuntu/change-apt-repo.sh
