defaults:
  image: nobreak-labs/ubuntu-26.04
  cpus: 4
  memory: 4096

vms:
  - name: kube-control1
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.11/24
    disks:
      - name: democratic-csi
        size: 50GB
    provision:
      - name: change-apt-repo
        inline: &change_apt_repo |
          #!/bin/bash
          set -e

          ARCH=$(uname -m)
          RELEASE=$(lsb_release -cs)
          if [ "$RELEASE" = "jammy" ]; then
            # Ubuntu 22.04
            if [ "$ARCH" = "x86_64" ]; then
              sed -i 's/archive.ubuntu.com\|kr.archive.ubuntu.com\|security.ubuntu.com/ftp.kaist.ac.kr/g' /etc/apt/sources.list
            elif [ "$ARCH" = "aarch64" ]; then
              sed -i 's/ports.ubuntu.com/ftp.kaist.ac.kr/g' /etc/apt/sources.list
            fi
          elif [ "$RELEASE" = "noble" ] || [ "$RELEASE" = "resolute" ]; then
            # Ubuntu 24.04 / 26.04
            if [ "$ARCH" = "x86_64" ]; then
              sed -i 's|^URIs:.*|URIs: http://ftp.kaist.ac.kr/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources
            elif [ "$ARCH" = "aarch64" ]; then
              sed -i 's|^URIs:.*|URIs: http://ftp.kaist.ac.kr/ubuntu-ports/|g' /etc/apt/sources.list.d/ubuntu.sources
            fi
          fi

  - name: kube-node1
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.21/24
    # disks:
    #   - name: ceph-osd
    #     size: 50GB
    provision:
      - name: change-apt-repo
        inline: *change_apt_repo

  - name: kube-node2
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.22/24
    # disks:
    #   - name: ceph-osd
    #     size: 50GB
    provision:
      - name: change-apt-repo
        inline: *change_apt_repo
    
