defaults:
  image: nobreak-labs/rockylinux-10
  cpus: 2
  memory: 2048

vms:
  - name: ansible-control
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.101/24
    provision:
      - name: install-ansible
        inline: |
          #!/bin/bash
          set -e

          sudo dnf install python3-pip -y
          sudo pip3 install ansible
  - name: ansible-node1
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.102/24
  - name: ansible-node2
    networks:
      - type: hostonly
        mode: static
        ip: 192.168.153.103/24
